version: "2"
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - revive
    - unused
    - unparam
    # depguard disabled: v2 format has default-deny behavior that blocks all imports
    # unless explicitly allow-listed. Manual review required for helmtools boundaries:
    #   - helmtools/ must NOT import: cobra, viper, internal/*, cmd/*
    #   - Use `grep -r "github.com/spf13/cobra\|github.com/rancher/ob-charts-tool/internal" helmtools/` to check
    # - depguard
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

# linters-settings:
#   Note: depguard disabled due to configuration complexity
#   Manually enforce: helmtools/ must not import cobra, viper, internal/*, cmd/*
