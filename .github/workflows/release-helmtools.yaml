name: Release helmtools library

on:
  push:
    tags:
      - "helmtools/v*"

permissions:
  contents: write

env:
  CI: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup go workspace
        run: go work init . ./helmtools

      - name: Run helmtools tests
        run: |
          cd helmtools
          go test -v -cover ./...

      - name: Run helmtools race detector
        run: |
          cd helmtools
          go test -race ./...

      - name: Run helmtools integration tests
        run: |
          cd helmtools
          go test -v -tags=integration ./git/

      - name: Run helmtools linter
        run: golangci-lint run ./helmtools/...

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"

          # Find previous helmtools tag
          PREV_TAG=$(git tag -l 'helmtools/v*' --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous helmtools tag found, using all history"
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Generating changelog from ${PREV_TAG} to ${CURRENT_TAG}"

          # Get commits affecting helmtools/ directory
          COMMITS=$(git log ${PREV_TAG}..${CURRENT_TAG} --oneline --no-merges -- helmtools/)

          if [ -z "$COMMITS" ]; then
            CHANGELOG="No changes to helmtools package in this release."
          else
            CHANGELOG="## Changes\n\n${COMMITS}"
          fi

          # Write to file for GitHub release
          echo -e "${CHANGELOG}" > changelog.md

          # Also output for logs
          echo "Changelog:"
          cat changelog.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --latest=false \
            --title "helmtools ${{ github.ref_name }}" \
            --notes-file changelog.md

      - name: Verify Go module proxy
        run: |
          # Give proxy.golang.org a moment to index the new tag
          sleep 30

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#helmtools/}"  # Strip helmtools/ prefix

          echo "Verifying module availability: github.com/rancher/ob-charts-tool/helmtools@${VERSION}"

          # This will fail if proxy can't fetch it
          GOPROXY=https://proxy.golang.org go list -m github.com/rancher/ob-charts-tool/helmtools@${VERSION} || \
            echo "Warning: Module not yet available on proxy.golang.org (may take a few minutes)"
