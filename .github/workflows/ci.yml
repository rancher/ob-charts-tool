name: Team ORBS Chart Tools CI

on:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name : Build, test  & validate
    runs-on : ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    strategy:
      matrix:
          include:
            - platform: linux/amd64
            - platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup go workspace
        run: go work init . ./helmtools
      - name : CI
        run : make ci
